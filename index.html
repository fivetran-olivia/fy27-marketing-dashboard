<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FY27 Marketing Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #30363d;
    --teal: #00d4aa;
    --amber: #f0a500;
    --violet: #a78bfa;
    --red: #f87171;
    --green: #34d399;
    --blue: #60a5fa;
    --text: #e6edf3;
    --muted: #7d8590;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid noise texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px;
    position: relative;
    z-index: 1;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .header-left { }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--sans);
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -.02em;
    color: var(--text);
  }
  .subtitle {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .date-badge {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 4px;
    letter-spacing: .06em;
  }

  /* ── KPI Cards ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 18px;
    cursor: pointer;
    transition: all .2s ease;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--teal));
    transition: height .2s ease;
  }
  .kpi-card:hover { border-color: var(--card-accent, var(--teal)); transform: translateY(-2px); }
  .kpi-card:hover::before { height: 3px; }
  .kpi-card.active {
    border-color: var(--card-accent, var(--teal));
    background: var(--surface2);
    box-shadow: 0 0 0 1px var(--card-accent, var(--teal)), 0 8px 32px rgba(0,0,0,.4);
  }
  .kpi-card.active::before { height: 3px; }

  .kpi-label {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .kpi-value {
    font-family: var(--sans);
    font-size: 40px;
    font-weight: 800;
    color: var(--card-accent, var(--teal));
    line-height: 1;
    margin-bottom: 6px;
    letter-spacing: -.02em;
  }
  .kpi-sub {
    font-size: 11px;
    color: var(--muted);
  }
  .kpi-hint {
    font-size: 10px;
    color: var(--card-accent, var(--teal));
    margin-top: 12px;
    opacity: 0;
    transition: opacity .2s;
  }
  .kpi-card:hover .kpi-hint, .kpi-card.active .kpi-hint { opacity: 1; }

  /* ── Section label ── */
  .section-label {
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Breakdown grid ── */
  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }

  .breakdown-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .breakdown-card h3 {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .bar-label {
    font-size: 11px;
    color: var(--text);
    width: 130px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .6s cubic-bezier(.16,1,.3,1);
  }
  .bar-count {
    font-size: 11px;
    color: var(--muted);
    width: 18px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ── Drill-down panel ── */
  .drill-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 40px;
    animation: slideDown .25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .drill-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .drill-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
  }
  .drill-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--active-accent-bg, rgba(0,212,170,.1));
    color: var(--active-accent, var(--teal));
    border: 1px solid var(--active-accent, var(--teal));
  }
  .drill-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all .15s;
    letter-spacing: .06em;
  }
  .drill-close:hover { border-color: var(--text); color: var(--text); }

  /* Campaign table */
  .campaign-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .campaign-table th {
    text-align: left;
    padding: 10px 16px;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    font-weight: 400;
  }
  .campaign-table td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(48,54,61,.5);
    vertical-align: top;
    color: var(--text);
  }
  .campaign-table tr:last-child td { border-bottom: none; }
  .campaign-table tr:hover td { background: var(--surface2); }

  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: .04em;
    font-family: var(--mono);
  }
  .tag-status-Live       { background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.3); }
  .tag-status-InProgress { background: rgba(0,212,170,.1);  color: var(--teal);  border: 1px solid rgba(0,212,170,.3); }
  .tag-status-Planning   { background: rgba(248,113,113,.1); color: var(--red);   border: 1px solid rgba(248,113,113,.3); }
  .tag-status-Complete   { background: rgba(167,139,250,.1); color: var(--violet);border: 1px solid rgba(167,139,250,.3); }
  .tag-funnel            { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .tag-motion            { background: rgba(96,165,250,.08); color: var(--blue); border: 1px solid rgba(96,165,250,.2); }

  .campaign-name {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
  }
  .campaign-meta { font-size: 11px; color: var(--muted); }

  .empty-state {
    padding: 48px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── Footer ── */
  .footer {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="eyebrow">FY27 · Marketing Operations</div>
      <h1>Campaign Dashboard</h1>
      <div class="subtitle">Click any metric to drill into campaigns &rarr;</div>
    </div>
    <div class="date-badge">Updated Feb 2026</div>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- Drill-down panel (hidden by default) -->
  <div id="drillPanel" style="display:none;"></div>

  <!-- Breakdown sections -->
  <div class="section-label">Portfolio breakdown</div>
  <div class="breakdown-grid" id="breakdownGrid"></div>

  <div class="footer">
    <span>FY27 Marketing Campaign Tracker &mdash; CMO View</span>
    <span>14 campaigns &middot; 1 focus area: Data Lakes</span>
  </div>
</div>

<script>
const CAMPAIGNS = [{"name":"Paid Ads for Data Lakes - Commercial Awareness","status":"In Progress","channel":"ABM Display Ads","motion":"Brand Awareness","funnel":"TOFU","persona":"Data Leader","geo":"Global","team":"Account-Based Marketing (ABM)","owner":"Krissy Murillo-Vaio","kpi":"Awareness/Reach","launch":"2026-03-02","end":"2026-04-30"},{"name":"Paid Ads for Data Lakes - Commercial Awareness","status":"In Progress","channel":"ABM LinkedIn Ads","motion":"Brand Awareness","funnel":"TOFU","persona":"Data Leader","geo":"Global","team":"Account-Based Marketing (ABM)","owner":"Krissy Murillo-Vaio","kpi":"Awareness/Reach","launch":"2026-03-02","end":"2026-04-30"},{"name":"Blog - Get started with Iceberg without the brain freeze","status":"Live","channel":"Blog","motion":"Brand Awareness","funnel":"MOFU","persona":"Data Practitioner","geo":"Global","team":"Content / Comms","owner":"Charles Wang","kpi":"Engagement","launch":"2026-02-06","end":null},{"name":"Blog - Data Lake Migration Guide","status":"Planning","channel":"Blog","motion":"Brand Awareness","funnel":"MOFU","persona":"Data Leader","geo":"Global","team":"Content / Comms","owner":"Charles Wang","kpi":"Engagement","launch":"2026-03-27","end":null},{"name":"Data Lakes Demo Request Page","status":"Live","channel":"Website","motion":"Demand Generation","funnel":"MOFU","persona":"All Personas","geo":"Global","team":"Digital & Demand Generation","owner":"Keena Desai","kpi":"MQLs","launch":"2026-01-27","end":null},{"name":"Update Data Lakes Drift Playbooks","status":"Live","channel":"Chat","motion":"Demand Generation","funnel":"MOFU","persona":"All Personas","geo":"Global","team":"Digital & Demand Generation","owner":"Keena Desai","kpi":"Leads","launch":"2026-01-23","end":null},{"name":"Data Lakes - Prospect Email Drip","status":"In Progress","channel":"Prospect Email","motion":"Demand Generation","funnel":"TOFU","persona":"All Personas","geo":"Global","team":"Digital & Demand Generation","owner":"Cat Jimenez","kpi":"MQLs","launch":"2026-03-02","end":null},{"name":"Data Lakes - Customer Email Drip","status":"In Progress","channel":"Customer Webinar","motion":"Demand Generation","funnel":"Expansion","persona":"All Personas","geo":"Global","team":"Customer Marketing","owner":"Nimerta Sekhon","kpi":"Product Adoption","launch":"2026-03-02","end":null},{"name":"Data Lakes - Paid Search","status":"Live","channel":"Paid Search","motion":"Demand Generation","funnel":"TOFU","persona":"All Personas","geo":"NAMER","team":"Digital & Demand Generation","owner":"MK Kjellin","kpi":"Engagement","launch":"2026-01-05","end":null},{"name":"The AI-ready data era: What every organization needs to build in 2026","status":"In Progress","channel":"Sponsored Webinar","motion":"Demand Generation","funnel":"MOFU","persona":"Data Leader","geo":"NAMER","team":"Digital & Demand Generation","owner":"Jaimie Ayliffe","kpi":"MQLs","launch":"2026-02-10","end":"2026-02-10"},{"name":"CDAO Financial Services NYC","status":"In Progress","channel":"Regional Conference","motion":"Brand Awareness","funnel":"BOFU","persona":"Data Leader","geo":"NAMER","team":"Regional Marketing","owner":"Cara Blazick & Nicole Bersinger","kpi":"MQLs","launch":"2026-02-18","end":"2026-02-19"},{"name":"Bucks vs. Celtics Suite","status":"In Progress","channel":"Sponsored Field Event","motion":"Revenue / Sales-Led","funnel":"BOFU","persona":"Data Leader","geo":"NAMER","team":"Regional Marketing","owner":"Anh Nguyen","kpi":"MQLs","launch":"2026-03-02","end":"2026-03-02"},{"name":"Data Analytics and AI for Financial Services Summit","status":"In Progress","channel":"Regional Conference","motion":"Brand Awareness","funnel":"TOFU","persona":"Data Leader","geo":"NAMER","team":"Regional Marketing","owner":"Cara Blazick & Nicole Bersinger","kpi":"MQLs","launch":"2026-03-04","end":"2026-03-05"},{"name":"CIO Meet - Detroit","status":"In Progress","channel":"Regional Conference","motion":"Brand Awareness","funnel":"TOFU","persona":"Data Leader","geo":"NAMER","team":"Regional Marketing","owner":"Anh Nguyen","kpi":"MQLs","launch":"2026-03-05","end":"2026-03-05"}];

const KPI_DEFS = [
  { key: 'total',       label: 'Total',        filter: () => true,                         accent: '#00d4aa', bg: 'rgba(0,212,170,.08)'   },
  { key: 'live',        label: 'Live',          filter: c => c.status === 'Live',           accent: '#34d399', bg: 'rgba(52,211,153,.08)'  },
  { key: 'inprogress',  label: 'In Progress',   filter: c => c.status === 'In Progress',    accent: '#60a5fa', bg: 'rgba(96,165,250,.08)'  },
  { key: 'planning',    label: 'Planning',      filter: c => c.status === 'Planning',       accent: '#f87171', bg: 'rgba(248,113,113,.08)' },
  { key: 'complete',    label: 'Complete',      filter: c => c.status === 'Complete',       accent: '#a78bfa', bg: 'rgba(167,139,250,.08)' },
];

let activeKey = null;

function count(filterFn) { return CAMPAIGNS.filter(filterFn).length; }

function renderKPIs() {
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = KPI_DEFS.map(def => {
    const n = count(def.filter);
    const sub = def.key === 'total' ? `across ${[...new Set(CAMPAIGNS.map(c=>c.team))].length} teams`
              : def.key === 'inprogress' ? `in active execution`
              : def.key === 'live' ? `campaigns running now`
              : def.key === 'planning' ? `pending launch`
              : `campaigns finished`;
    return `
      <div class="kpi-card ${activeKey === def.key ? 'active' : ''}"
           style="--card-accent:${def.accent}"
           onclick="toggleDrill('${def.key}')">
        <div class="kpi-label">${def.label}</div>
        <div class="kpi-value">${n}</div>
        <div class="kpi-sub">${sub}</div>
        <div class="kpi-hint">▼ view campaigns</div>
      </div>`;
  }).join('');
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
}

function statusClass(s) {
  return 'tag tag-status-' + s.replace(/\s+/g,'');
}

function toggleDrill(key) {
  if (activeKey === key) {
    activeKey = null;
  } else {
    activeKey = key;
  }
  renderKPIs();
  renderDrill();
}

function renderDrill() {
  const panel = document.getElementById('drillPanel');
  if (!activeKey) { panel.style.display = 'none'; return; }

  const def = KPI_DEFS.find(d => d.key === activeKey);
  const filtered = CAMPAIGNS.filter(def.filter);
  panel.style.display = 'block';

  const rows = filtered.length === 0
    ? `<tr><td colspan="6"><div class="empty-state">No campaigns match this filter.</div></td></tr>`
    : filtered.map(c => `
      <tr>
        <td>
          <div class="campaign-name">${c.name}</div>
          <div class="campaign-meta">${c.channel} &middot; ${c.owner}</div>
        </td>
        <td><span class="${statusClass(c.status)}">${c.status}</span></td>
        <td><span class="tag tag-funnel">${c.funnel}</span></td>
        <td><span class="tag tag-motion">${c.motion}</span></td>
        <td style="color:var(--muted);font-size:11px">${c.geo}</td>
        <td style="color:var(--muted);font-size:11px">${formatDate(c.launch)}</td>
      </tr>`).join('');

  panel.innerHTML = `
    <div class="drill-panel">
      <div class="drill-header" style="--active-accent:${def.accent};--active-accent-bg:${def.bg}">
        <div class="drill-title">
          ${def.label} Campaigns
          <span class="drill-badge">${filtered.length} campaign${filtered.length !== 1 ? 's' : ''}</span>
        </div>
        <button class="drill-close" onclick="toggleDrill('${activeKey}')">✕ close</button>
      </div>
      <table class="campaign-table">
        <thead>
          <tr>
            <th>Campaign</th>
            <th>Status</th>
            <th>Funnel</th>
            <th>Motion</th>
            <th>Geo</th>
            <th>Launch</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderBreakdowns() {
  const breakdowns = [
    {
      title: 'Funnel Stage',
      items: ['TOFU','MOFU','BOFU','Expansion'],
      getVal: v => count(c => c.funnel === v),
      colors: ['#00d4aa','#f0a500','#34d399','#a78bfa'],
    },
    {
      title: 'Motion Mix',
      items: ['Brand Awareness','Demand Generation','Revenue / Sales-Led'],
      getVal: v => count(c => c.motion === v),
      colors: ['#60a5fa','#f0a500','#34d399'],
    },
    {
      title: 'Primary KPI',
      items: ['MQLs','Engagement','Awareness/Reach','Leads','Product Adoption'],
      getVal: v => count(c => c.kpi === v),
      colors: ['#00d4aa','#60a5fa','#f0a500','#34d399','#a78bfa'],
    },
    {
      title: 'Primary Channel (Top 5)',
      items: [...new Set(CAMPAIGNS.map(c=>c.channel))].map(ch=>({ch,n:count(c=>c.channel===ch)})).sort((a,b)=>b.n-a.n).slice(0,5).map(x=>x.ch),
      getVal: v => count(c => c.channel === v),
      colors: ['#00d4aa','#60a5fa','#f0a500','#f87171','#a78bfa'],
    },
    {
      title: 'Team Ownership',
      items: [...new Set(CAMPAIGNS.map(c=>c.team))].map(t=>({t,n:count(c=>c.team===t)})).sort((a,b)=>b.n-a.n).map(x=>x.t),
      getVal: v => count(c => c.team === v),
      colors: ['#00d4aa','#60a5fa','#f0a500','#34d399','#a78bfa'],
    },
    {
      title: 'Geography',
      items: ['Global','NAMER'],
      getVal: v => count(c => c.geo === v),
      colors: ['#00d4aa','#f0a500'],
    },
  ];

  const total = CAMPAIGNS.length;
  const grid = document.getElementById('breakdownGrid');
  grid.innerHTML = breakdowns.map(b => {
    const bars = b.items.map((item, i) => {
      const n = b.getVal(item);
      const pct = Math.round(n/total*100);
      return `
        <div class="bar-row">
          <div class="bar-label" title="${item}">${item}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${b.colors[i%b.colors.length]}"></div></div>
          <div class="bar-count">${n}</div>
        </div>`;
    }).join('');
    return `
      <div class="breakdown-card">
        <h3>${b.title}</h3>
        ${bars}
      </div>`;
  }).join('');
}

renderKPIs();
renderDrill();
renderBreakdowns();
</script>
</body>
</html>
